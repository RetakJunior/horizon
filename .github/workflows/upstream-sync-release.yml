name: REa upstream sync builds

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build the latest upstream release again, even if already synced
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rea-upstream-sync
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      should_sync: ${{ steps.merge.outputs.should_sync }}
      upstream_tag: ${{ steps.merge.outputs.upstream_tag }}
      release_sha: ${{ steps.merge.outputs.release_sha }}
      upstream_main_sha: ${{ steps.merge.outputs.upstream_main_sha }}
      merged_sha: ${{ steps.merge.outputs.merged_sha }}
      release_tag: ${{ steps.merge.outputs.release_tag }}
      force_sync: ${{ steps.merge.outputs.force_sync }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: release
        name: Read the latest upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view --repo horizon-rust/horizon --json tagName,url,publishedAt,body > "$RUNNER_TEMP/upstream-release.json"
          cat "$RUNNER_TEMP/upstream-release.json"
          echo "tag=$(jq -r .tagName "$RUNNER_TEMP/upstream-release.json")" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r .url "$RUNNER_TEMP/upstream-release.json")" >> "$GITHUB_OUTPUT"
          echo "published_at=$(jq -r .publishedAt "$RUNNER_TEMP/upstream-release.json")" >> "$GITHUB_OUTPUT"
      - id: merge
        name: Compare sync state and rebase the REa patch
        env:
          UPSTREAM_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
          FORCE_SYNC: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/horizon-rust/horizon.git

          previous_tag=""
          if git ls-remote --exit-code origin refs/heads/rea-sync-state >/dev/null 2>&1; then
            git fetch --no-tags origin refs/heads/rea-sync-state:refs/remotes/origin/rea-sync-state
            previous_tag="$(git show refs/remotes/origin/rea-sync-state:.github/rea-upstream-sync.json 2>/dev/null | jq -r '.upstream_tag // empty' || true)"
          fi
          if [[ "$UPSTREAM_TAG" == "$previous_tag" && "$FORCE_SYNC" != "true" ]]; then
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
            echo "### Upstream $UPSTREAM_TAG is already built" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git fetch --no-tags upstream main:refs/remotes/upstream/main
          git fetch --no-tags upstream "refs/tags/$UPSTREAM_TAG:refs/tags/rea-upstream-release"
          source_base_sha="$(git merge-base HEAD refs/remotes/upstream/main)"
          release_sha="$(git rev-parse 'refs/tags/rea-upstream-release^{commit}')"
          upstream_main_sha="$(git rev-parse refs/remotes/upstream/main)"
          # Keep this fork's branding and launcher changes on top of the latest upstream tree.
          git rebase --rebase-merges --onto refs/remotes/upstream/main "$source_base_sha"
          merged_sha="$(git rev-parse HEAD)"
          release_version="${UPSTREAM_TAG#launcher@}"
          release_version="${release_version#v}"
          release_tag="v${release_version}-rea"

          mkdir -p "$RUNNER_TEMP/rea-sync"
          git archive --format=tar.gz --output="$RUNNER_TEMP/rea-sync/source.tar.gz" HEAD
          git bundle create "$RUNNER_TEMP/rea-sync/source.bundle" HEAD "^refs/remotes/upstream/main"
          jq -n \
            --arg upstream_tag "$UPSTREAM_TAG" \
            --arg release_sha "$release_sha" \
            --arg upstream_main_sha "$upstream_main_sha" \
            --arg merged_sha "$merged_sha" \
            --arg release_url "$RELEASE_URL" \
            --arg published_at "$PUBLISHED_AT" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{upstream_tag:$upstream_tag,release_sha:$release_sha,upstream_main_sha:$upstream_main_sha,merged_sha:$merged_sha,release_url:$release_url,published_at:$published_at,run_url:$run_url}' \
            > "$RUNNER_TEMP/rea-sync/rea-sync-report.json"
          {
            echo "## REa Launcher upstream build"
            echo
            echo "- Upstream release: [$UPSTREAM_TAG]($RELEASE_URL)"
            echo "- Upstream release commit: \`$release_sha\`"
            echo "- Upstream main commit: \`$upstream_main_sha\`"
            echo "- Merged source commit: \`$merged_sha\`"
            echo "- Build artifacts are attached to this Actions run for 14 days."
            echo
            echo "## Upstream release notes"
            echo
            jq -r 'if (.body // "") == "" then "_No upstream notes were provided._" else .body end' "$RUNNER_TEMP/upstream-release.json"
          } > "$RUNNER_TEMP/rea-sync/rea-sync-report.md"
          echo "should_sync=true" >> "$GITHUB_OUTPUT"
          echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "upstream_main_sha=$upstream_main_sha" >> "$GITHUB_OUTPUT"
          echo "merged_sha=$merged_sha" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "force_sync=$FORCE_SYNC" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/rea-sync/rea-sync-report.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: steps.merge.outputs.should_sync == 'true'
        with:
          name: rea-sync-source
          path: |
            ${{ runner.temp }}/rea-sync/source.tar.gz
            ${{ runner.temp }}/rea-sync/source.bundle
            ${{ runner.temp }}/rea-sync/rea-sync-report.json
            ${{ runner.temp }}/rea-sync/rea-sync-report.md
          retention-days: 1

  build:
    needs: prepare
    if: needs.prepare.outputs.should_sync == 'true'
    name: build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
            target: ''
          - platform: windows-x86_64
            os: windows-2025
            target: ''
            windows_arch: x64
            rustflags: -C target-feature=+crt-static
          - platform: windows-arm64
            os: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            windows_arch: arm64
            rustflags: -C target-feature=+crt-static
          - platform: macos-arm64
            os: macos-15
            target: ''
            mac_arch: arm64
          - platform: macos-x86_64
            os: macos-15-intel
            target: ''
            mac_arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
      TARGET: ${{ matrix.target }}
      RUSTFLAGS: ${{ matrix.rustflags }}
      RUST_FONTCONFIG_DLOPEN: ${{ matrix.platform == 'linux-x86_64' && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: rea-sync-source
          path: ${{ runner.temp }}/rea-sync-source
      - name: Unpack the merged source snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .git
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          tar -xzf "$RUNNER_TEMP/rea-sync-source/source.tar.gz" -C "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev patchelf
      - name: Build the launcher
        shell: bash
        working-directory: launcher
        run: |
          set -euo pipefail
          target_args=()
          if [[ -n "$TARGET" ]]; then target_args=(--target "$TARGET"); fi
          cargo build --release --locked --bin rea-launcher "${target_args[@]}"
          cargo metadata --no-deps --format-version 1 > "$RUNNER_TEMP/rea-cargo-metadata.json"
          jq -r '.packages[] | select(.name == "rea-launcher") | .version' "$RUNNER_TEMP/rea-cargo-metadata.json" > "$RUNNER_TEMP/rea-cargo-version"
      - name: Package Linux AppImage and tarball
        if: matrix.platform == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat "$RUNNER_TEMP/rea-cargo-version")
          mkdir -p out
          packaging/linux/appimage.sh launcher/target/release/rea-launcher "$version" out
          mkdir -p "$RUNNER_TEMP/rea-tar/bin" "$RUNNER_TEMP/rea-tar/share/applications" "$RUNNER_TEMP/rea-tar/share/icons/hicolor"
          install -m 755 launcher/target/release/rea-launcher "$RUNNER_TEMP/rea-tar/bin/rea-launcher"
          install -m 644 packaging/linux/rea-launcher.desktop "$RUNNER_TEMP/rea-tar/share/applications/rea-launcher.desktop"
          cp -R packaging/icons/hicolor/. "$RUNNER_TEMP/rea-tar/share/icons/hicolor/"
          tar -czf "out/rea-launcher-${UPSTREAM_TAG}-rea-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/rea-tar" .
          mv out/rea-launcher-linux-x86_64.AppImage "out/rea-launcher-${UPSTREAM_TAG}-rea-linux-x86_64.AppImage"
      - name: Package Windows installer and portable zip
        if: startsWith(matrix.platform, 'windows-')
        env:
          WINDOWS_ARCH: ${{ matrix.windows_arch }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out portable
          binary=launcher/target/release/rea-launcher.exe
          if [[ -n "$TARGET" ]]; then binary="launcher/target/$TARGET/release/rea-launcher.exe"; fi
          python tools/check_pe_arch.py "$WINDOWS_ARCH" "$binary"
          python tools/check_imports.py "$binary"
          cp "$binary" "out/rea-launcher-setup-${UPSTREAM_TAG}-rea-windows-${WINDOWS_ARCH}.exe"
          cp "$binary" portable/rea-launcher.exe
          (cd portable && 7z a "../out/rea-launcher-${UPSTREAM_TAG}-rea-windows-${WINDOWS_ARCH}.zip" rea-launcher.exe >/dev/null)
      - name: Install dmgbuild
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/dmg"
          "$RUNNER_TEMP/dmg/bin/pip" install --quiet dmgbuild==1.6.5
      - name: Package macOS disk image
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat "$RUNNER_TEMP/rea-cargo-version")
          arch='${{ matrix.mac_arch }}'
          mkdir -p out
          DMGBUILD="$RUNNER_TEMP/dmg/bin/dmgbuild" packaging/macos/package.sh \
            "launcher/target/release/rea-launcher" "$version" out "$arch"
          mv "out/rea-launcher-macos-$arch.dmg" "out/rea-launcher-${UPSTREAM_TAG}-rea-$arch.dmg"
          rm -f "out/rea-launcher-macos-$arch.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: REa-${{ needs.prepare.outputs.upstream_tag }}-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  record-success:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_sync == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: rea-sync-source
          path: ${{ runner.temp }}/rea-sync-source
      - uses: actions/upload-artifact@v7
        with:
          name: REa-${{ needs.prepare.outputs.upstream_tag }}-report
          path: |
            ${{ runner.temp }}/rea-sync-source/rea-sync-report.json
            ${{ runner.temp }}/rea-sync-source/rea-sync-report.md
          if-no-files-found: error
          retention-days: 14
      - name: Download all platform binaries
        uses: actions/download-artifact@v8
        with:
          pattern: REa-${{ needs.prepare.outputs.upstream_tag }}-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
          MERGED_SHA: ${{ needs.prepare.outputs.merged_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          FORCE_SYNC: ${{ needs.prepare.outputs.force_sync }}
        run: |
          set -euo pipefail
          echo "Publishing release with tag $RELEASE_TAG"

          assets=()
          for f in "${{ runner.temp }}/release-assets"/*; do
            if [[ -f "$f" && "$f" != *.json && "$f" != *.md ]]; then
              assets+=("$f")
            fi
          done
          ((${#assets[@]})) || { echo "No release assets were downloaded." >&2; exit 1; }

          # The tag points to precisely the source tree that produced these assets.
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            tag_target="$(git rev-list -n1 "$RELEASE_TAG")"
            if [[ "$tag_target" != "$MERGED_SHA" ]]; then
              echo "Existing $RELEASE_TAG points to $tag_target, expected $MERGED_SHA." >&2
              exit 1
            fi
          else
            git remote add upstream https://github.com/horizon-rust/horizon.git
            git fetch --no-tags upstream main:refs/remotes/upstream/main
            git fetch "$RUNNER_TEMP/rea-sync-source/source.bundle" HEAD:refs/heads/rea-upstream-build
            git tag -a "$RELEASE_TAG" "$MERGED_SHA" -m "REa Launcher $RELEASE_TAG (upstream $UPSTREAM_TAG)"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$FORCE_SYNC" != "true" ]]; then
              echo "Release $RELEASE_TAG already exists; refusing to replace it." >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "REa Launcher $RELEASE_TAG (upstream $UPSTREAM_TAG)" \
              --notes-file "${{ runner.temp }}/rea-sync-source/rea-sync-report.md"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --title "REa Launcher $RELEASE_TAG (upstream $UPSTREAM_TAG)" \
              --notes-file "${{ runner.temp }}/rea-sync-source/rea-sync-report.md"
          fi
      - name: Record the successful upstream baseline
        env:
          UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          UPSTREAM_MAIN_SHA: ${{ needs.prepare.outputs.upstream_main_sha }}
          MERGED_SHA: ${{ needs.prepare.outputs.merged_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin refs/heads/rea-sync-state >/dev/null 2>&1; then
            git fetch --no-tags origin refs/heads/rea-sync-state:refs/remotes/origin/rea-sync-state
            git switch --force-create rea-sync-state refs/remotes/origin/rea-sync-state
          else
            git switch --orphan rea-sync-state
            git rm -rf --cached . >/dev/null 2>&1 || true
            git clean -fdx
          fi
          mkdir -p .github
          jq -n \
            --arg upstream_tag "$UPSTREAM_TAG" \
            --arg release_sha "$RELEASE_SHA" \
            --arg upstream_main_sha "$UPSTREAM_MAIN_SHA" \
            --arg merged_sha "$MERGED_SHA" \
            --arg release_tag "$RELEASE_TAG" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{upstream_tag:$upstream_tag,release_sha:$release_sha,upstream_main_sha:$upstream_main_sha,merged_sha:$merged_sha,release_tag:$release_tag,run_url:$run_url}' \
            > .github/rea-upstream-sync.json
          git add .github/rea-upstream-sync.json
          if ! git diff --cached --quiet; then
            git commit -m "Record successful upstream build for $UPSTREAM_TAG"
          fi
          git push origin HEAD:refs/heads/rea-sync-state
